<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Torneos - CanchaGol</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header class="header">
        <nav class="navbar">
            <a href="../index.html" class="logo">⚽ CanchaGol</a>
            <ul class="nav-links">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="canchas.html">Canchas</a></li>
                <li><a href="reservas.html">Reservas</a></li>
                <li><a href="dashboard.html" class="active">Torneos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 class="page-title">Gestión de Torneos e Inscripciones</h1>

        <!-- Métricas Rápidas -->
        <section class="grid-stats">
            <div class="card stat-card">
                <h3>Torneos Disponibles</h3>
                <p class="stat-number">6</p>
            </div>
            <div class="card stat-card">
                <h3>Equipos Inscritos</h3>
                <p class="stat-number" id="statTotalEquipos">0</p>
            </div>
            <div class="card stat-card">
                <h3>Total Reservas</h3>
                <p class="stat-number" id="statTotalReservas">0</p>
            </div>
        </section>

        <div class="grid-2col">
            <!-- Formulario para Registrar Equipo -->
            <section class="card">
                <h2 style="margin-bottom: 1.2rem; font-size: 1.4rem;">Inscribir Equipo a un Torneo</h2>
                <form id="formTorneo">
                    <div class="form-group">
                        <label for="nombreEquipo">Nombre del Equipo</label>
                        <input type="text" id="nombreEquipo" placeholder="Ej: Los Galácticos FC" required>
                    </div>

                    <div class="form-group">
                        <label for="nombreCapitan">Nombre del Capitán</label>
                        <input type="text" id="nombreCapitan" placeholder="Nombre y apellido" required>
                    </div>

                    <div class="form-group">
                        <label for="telefonoCapitan">Teléfono de Contacto</label>
                        <input type="tel" id="telefonoCapitan" placeholder="Ej: 300 123 4567" required>
                    </div>

                    <div class="form-group">
                        <label for="torneoSelect">Seleccionar Torneo</label>
                        <select id="torneoSelect" required>
                            <option value="" disabled selected>Selecciona un torneo...</option>
                            <option value="Copa Empresarial (Fútbol 7)">Copa Empresarial (Fútbol 7)</option>
                            <option value="Torneo Relámpago (Futsal)">Torneo Relámpago (Futsal)</option>
                            <option value="Torneo Intercolegial (Fútbol 11)">Torneo Intercolegial (Fútbol 11)</option>
                            <option value="Torneo Amateur (Fútbol 5)">Torneo Amateur (Fútbol 5)</option>
                            <option value="Torneo Profesional (Fútbol 11)">Torneo Profesional (Fútbol 11)</option>
                            <option value="Torneo Distrital (Fútbol 7)">Torneo Distrital (Fútbol 7)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Registrar Equipo</button>
                </form>
            </section>

            <!-- Lista de Equipos Inscritos -->
            <section class="card">
                <h2 style="margin-bottom: 1.2rem; font-size: 1.4rem;">Equipos Confirmados</h2>
                <div class="table-responsive">
                    <table class="tabla">
                        <thead>
                            <tr>
                                <th>Equipo</th>
                                <th>Capitán</th>
                                <th>Torneo</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="bodyTablaTorneos">
                            <!-- Inyección dinámica por JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 CanchaGol </p>
    </footer>

    <script src="../js/crud.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
